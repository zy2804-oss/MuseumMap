<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Museum Nearby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ8qRkP0tTz20zI9qZrLGbZ6Bd0hwT8=" crossorigin="">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="overrides.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="map-view" aria-labelledby="app-title">
        <div id="map" class="real-map" aria-label="Interactive map of museums in Manhattan"></div>
        <header class="topbar">
          <button class="wordmark" data-page="home" aria-label="Return to map"><span>Museum</span><em>nearby</em></button>
          <button class="menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="menu"><i aria-hidden="true"></i>Menu</button>
        </header>
        <div class="zoom-controls" aria-label="Map zoom controls"><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button></div>
        <div class="map-caption" id="map-caption"><span>●</span> Locating you…</div>
        <h1 class="sr-only" id="app-title">Museum Nearby</h1>
      </section>

      <aside class="menu-panel" id="menu" aria-hidden="true">
        <div class="panel-head"><div><p class="eyebrow">Explore nearby</p><h2>Museums</h2></div><button class="icon-button close-menu" aria-label="Close menu and return to map">×</button></div>
        <div class="tabs" role="tablist" aria-label="Museum categories"><button role="tab" aria-selected="true" data-category="all">All</button><button role="tab" aria-selected="false" data-category="art">Art</button><button role="tab" aria-selected="false" data-category="natural">Natural</button></div>
        <div class="filters"><button class="filter is-active" data-filter="open">Open now</button><button class="filter" data-filter="free">Free / pay-what-you-wish</button><button class="filter" data-filter="near">Nearest</button></div>
        <div class="museum-cards" id="museum-cards"></div>
        <nav class="menu-footer"><button data-page="account"><span>◒</span>My account</button><button data-page="next"><span>→</span>Next visit</button></nav>
      </aside>
      <section class="detail-panel" id="detail-panel" aria-hidden="true"></section>
      <section class="account-panel" id="account-panel" aria-hidden="true"></section>
      <div class="scrim" aria-hidden="true"></div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
